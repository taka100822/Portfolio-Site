<!doctype html>
<!--
  SNS シェア用の OGP 画像（public/Image/og.png）の元。作り直すときは:
  "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 --screenshot=public/Image/og.png scripts/og-image.html
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #03060C;
    --line: #1D3A6E;
    --signal: #3B82F6;
    --paper: #E6ECF5;
    --pencil: #7C889C;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--black); }
  body {
    position: relative;
    font-family: 'IBM Plex Sans JP', sans-serif;
    color: var(--paper);
    background-image:
      linear-gradient(to right, rgba(29, 58, 110, 0.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(29, 58, 110, 0.35) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 75% 85% at 72% 45%, transparent 25%, var(--black) 90%);
  }

  /* 右側：作品画像を Hero のリングのように奥へ並べる */
  .stage {
    position: absolute;
    right: -40px;
    top: 0;
    width: 700px;
    height: 630px;
    perspective: 1600px;
    z-index: 1;
  }
  .card {
    position: absolute;
    width: 440px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .card.back1 { left: 300px; top: 70px;  transform: rotateY(-38deg) scale(0.82); opacity: 0.45; }
  .card.back2 { left: 20px;  top: 330px; transform: rotateY(32deg) scale(0.8);  opacity: 0.45; }
  .card.front {
    left: 120px;
    top: 170px;
    width: 500px;
    transform: rotateY(-12deg) rotateX(4deg);
    border-color: var(--signal);
    box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.4), 0 30px 80px rgba(59, 130, 246, 0.25);
  }

  /* 左側：コピー */
  .copy {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    z-index: 2;
  }
  .tag {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--signal);
  }
  h1 {
    font-family: 'Dela Gothic One', sans-serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.3;
    text-shadow: 0 2px 24px var(--black);
  }
  .meta {
    font-size: 22px;
    line-height: 1.6;
    color: var(--pencil);
  }
  .meta strong { color: var(--paper); font-size: 30px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="stage">
    <img class="card back1" src="../public/Image/works/CrashReport/CRASH REPORT2.png" alt="">
    <img class="card back2" src="../public/Image/works/Furachi/Furachi2.png" alt="">
    <img class="card front" src="../public/Image/works/DreamMayday/DreamMayday2.png" alt="">
  </div>
  <div class="copy">
    <p class="tag">GAME PLANNER PORTFOLIO</p>
    <h1>人生の一部となる<br>体験を創造する。</h1>
    <p class="meta"><strong>Taka10</strong><br>27卒ゲームプランナー</p>
  </div>
</body>
</html>
